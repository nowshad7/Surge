name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, sockets, mbstring, pcntl
          coverage: none

      - name: Lint every PHP file
        run: |
          set -e
          find src bin tests bench config -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Run the test suite
        run: php tests/run.php

      - name: Smoke-test the Pusher server end to end
        run: php tests/integration/smoke.php
